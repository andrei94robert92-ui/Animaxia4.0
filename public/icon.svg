<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18070c"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#2a0815"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#e11d48" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#e11d48" opacity="0.25" filter="url(#glow)"/>

  <!-- Play Symbol / Stylized Anime Crest -->
  <polygon points="196,140 376,256 196,372" fill="url(#roseGrad)" filter="url(#glow)"/>
  
  <!-- Sleek Accent Wing / Letter A apex -->
  <path d="M256,120 L310,240 L256,220 L202,240 Z" fill="#ffffff" opacity="0.95"/>
  <polygon points="256,190 286,256 226,256" fill="url(#goldGrad)"/>

  <!-- Japanese Katakana small detail "アニメ" -->
  <text x="256" y="440" font-family="sans-serif" font-weight="900" font-size="28" fill="#fda4af" text-anchor="middle" letter-spacing="8">ANIMAXIA</text>
</svg>
